<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <!-- Луч пули: ярко-голубое ядро с мягкими краями -->
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#4DD0E1" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#4DD0E1" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#80EEFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beamGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#4DD0E1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4DD0E1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#80EEFF" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Астероид: тёмный graphite с лёгким top-light -->
    <linearGradient id="rockBody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"  stop-color="#3A3F4A"/>
      <stop offset="60%" stop-color="#262A33"/>
      <stop offset="100%" stop-color="#15171C"/>
    </linearGradient>
  </defs>

  <!-- Луч свечения (широкий, мягкий) -->
  <rect x="50" y="50" width="8" height="50" fill="url(#beamGlow)" rx="4"/>
  <!-- Луч ядра (узкий, яркий) -->
  <rect x="52.5" y="50" width="3" height="50" fill="url(#beam)" rx="1.5"/>
  <!-- Хвостовая яркая точка (вспышка пули) -->
  <circle cx="54" cy="98" r="2.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="54" cy="98" r="5" fill="#80EEFF" opacity="0.4"/>

  <!-- Астероид: неровный многоугольник с обводкой (флэт-стиль) -->
  <g>
    <!-- Тень/обводка -->
    <path d="M 36,30 L 28,38 L 26,50 L 32,60 L 44,66 L 60,64 L 72,56 L 76,44 L 70,32 L 56,26 L 44,26 Z"
          fill="#0A0C12" opacity="0.6" transform="translate(1.5, 2)"/>
    <!-- Основное тело -->
    <path d="M 36,30 L 28,38 L 26,50 L 32,60 L 44,66 L 60,64 L 72,56 L 76,44 L 70,32 L 56,26 L 44,26 Z"
          fill="url(#rockBody)" stroke="#0F1116" stroke-width="1.2"/>
    <!-- Кратеры: тёмные круги с подсвеченной кромкой -->
    <!-- Большой кратер -->
    <ellipse cx="44" cy="44" rx="6" ry="5" fill="#15171C"/>
    <ellipse cx="44" cy="43" rx="6" ry="5" fill="none" stroke="#4A505C" stroke-width="0.8"/>
    <!-- Средний кратер -->
    <ellipse cx="62" cy="50" rx="4" ry="3.5" fill="#15171C"/>
    <ellipse cx="62" cy="49.3" rx="4" ry="3.5" fill="none" stroke="#4A505C" stroke-width="0.7"/>
    <!-- Малый кратер -->
    <circle cx="55" cy="36" r="2.2" fill="#15171C"/>
    <circle cx="55" cy="35.7" r="2.2" fill="none" stroke="#4A505C" stroke-width="0.5"/>
    <!-- Светлый highlight на верхнем-левом крае -->
    <path d="M 30,36 Q 36,28 48,26"
          fill="none" stroke="#5A6170" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
